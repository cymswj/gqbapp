name: Build and Deploy GQB Tools
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate tool catalog
        run: python scripts/validate.py
      - name: Structural audit
        run: python scripts/audit.py
      - name: Validate JavaScript syntax
        run: node --check public/app.js
      - name: Runtime initialization smoke test
        run: node scripts/runtime-smoke.js
      - name: Task router smoke test
        run: node scripts/task-router-smoke.js
      - name: Workflow execution engine smoke test
        run: node scripts/engine-smoke.js
      - name: Workflow DAG smoke test
        run: node scripts/workflow-smoke.js
      - name: Audit tool button wiring
        run: node scripts/button-audit.js
      - name: Build localized pages
        run: python -m py_compile scripts/build.py && python scripts/build.py
      - name: Browser end-to-end tool smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m http.server 4173 --directory dist >/tmp/gqb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          GQB_E2E_BASE_URL=http://127.0.0.1:4173 node scripts/e2e-smoke.js
      - name: Check generated navigation interactions
        run: node scripts/navigation-smoke.js
      - name: Cross-page header navigation smoke test
        run: |
          python -m http.server 4173 --directory dist >/tmp/gqb-http-header.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          GQB_E2E_BASE_URL=http://127.0.0.1:4173 node scripts/header-navigation-smoke.js
      - name: Check generated links
        run: python scripts/linkcheck.py
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
