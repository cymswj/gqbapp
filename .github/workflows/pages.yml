name: Build and Deploy GQB Tools
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate tool catalog
        run: python scripts/validate.py
      - name: Structural audit
        run: python scripts/audit.py
      - name: Validate JavaScript syntax
        run: node --check public/app.js
      - name: Runtime initialization smoke test
        run: node scripts/runtime-smoke.js
      - name: Build localized pages
        run: python -m py_compile scripts/build.py && python scripts/build.py
      - name: Check generated links
        run: python scripts/linkcheck.py
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
