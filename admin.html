<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GQB Tools SEO 管理后台</title><style>body{margin:0;background:#f5f6f8;color:#111827;font:14px/1.6 Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin-bottom:16px}h1{margin-top:0}label{display:block;color:#667085;font-size:12px;margin:12px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8dde5;border-radius:9px;font:inherit}button{border:0;background:#111827;color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;margin:8px 8px 0 0}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{margin-top:12px;padding:10px;background:#f1f3f6;border-radius:9px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>GQB Tools SEO 管理后台</h1><p class="muted">管理站点名称、Base URL、robots、验证代码，并为未来的在线 SEO 后台 API 预留入口。GitHub Pages 本身是静态托管，因此真正在线保存 SEO 配置需要接 Worker/KV。</p><div class="grid"><div><label>站点名称</label><input id="name" value="GQB Tools"></div><div><label>默认语言</label><select id="loc"><option>en</option><option>zh</option><option>es</option><option>fr</option><option>de</option><option>pt</option><option>ru</option><option>ja</option><option>ar</option><option>id</option></select></div></div><label>Base URL</label><input id="base" value="https://cymswj.github.io/gqbapp"><label>Robots</label><input id="robots" value="index,follow"><div class="grid"><div><label>Google Analytics ID</label><input id="ga"></div><div><label>Google Site Verification</label><input id="gsv"></div></div><button onclick="saveLocal()">保存本机草稿</button><button onclick="downloadConfig()">导出配置</button><div class="status" id="s">准备就绪</div></div><div class="card"><h2>在线 API</h2><p class="muted">部署 Worker + KV 后，把 API 地址和后台密码填入这里即可在线读取/保存基础 SEO 配置。密码不会写入 GitHub 文件。</p><label>API 地址</label><input id="api" placeholder="https://your-worker.example.com/api/seo"><label>后台密码</label><input id="pw" type="password"><button onclick="apiGet()">读取</button><button onclick="apiPut()">保存</button><div class="status" id="as">未连接</div></div></div><script>
function obj(){return{name:name.value,defaultLocale:loc.value,baseUrl:base.value,robots:robots.value,ga:ga.value,gsv:gsv.value}}
function fill(x){name.value=x.name||x.siteName||'GQB Tools';loc.value=x.defaultLocale||'en';base.value=x.baseUrl||'https://cymswj.github.io/gqbapp';robots.value=x.robots||'index,follow';ga.value=x.ga||'';gsv.value=x.gsv||''}
function saveLocal(){localStorage.gqbSeo=JSON.stringify(obj());s.textContent='已保存到本机浏览器。'}
function downloadConfig(){const x=obj();const data={siteName:x.name,siteTagline:'Free online tools for everyday work',baseUrl:x.baseUrl,defaultLocale:x.defaultLocale,supportedLocales:['en','zh','es','fr','de','pt','ru','ja','ar','id'],ogImage:'/public/og-default.svg',themeColor:'#111827',analytics:{googleAnalyticsId:x.ga,googleSiteVerification:x.gsv,bingSiteVerification:''},seo:{robots:x.robots,defaultTitleSuffix:' | GQB Tools',twitterCard:'summary_large_image'}};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='site-config.json';a.click()}
async function apiGet(){try{const r=await fetch(api.value);if(!r.ok)throw 0;fill(await r.json());as.textContent='读取成功。'}catch(e){as.textContent='读取失败，请检查 API 地址。'}}
async function apiPut(){try{const r=await fetch(api.value,{method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Password':pw.value},body:JSON.stringify(obj())});as.textContent=r.ok?'保存成功。':'保存失败 '+r.status}catch(e){as.textContent='连接失败。'}}
fill(JSON.parse(localStorage.gqbSeo||'null')||{});
</script></body></html>
